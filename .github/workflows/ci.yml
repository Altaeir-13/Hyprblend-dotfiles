name: CI — Hybrid Rice Test Suite & Static Analysis

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-checks:
    name: Static Syntax & Portability Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Shell Syntax Validation (bash -n)
        run: |
          # NOTE: `bash -n a b c` only parses the FIRST file (the rest become arguments),
          # so every script must be checked individually.
          # Exception: fuzzel-emoji.sh keeps an emoji data section after `exit`, which is
          # valid at runtime but not parseable as shell by `bash -n`.
          fail=0
          count=0
          while IFS= read -r -d '' f; do
            case "$f" in
              ./dots/.config/hypr/hyprland/scripts/fuzzel-emoji.sh) continue ;;
            esac
            count=$((count + 1))
            if ! bash -n "$f"; then
              echo "::error file=${f#./}::bash -n failed"
              fail=1
            fi
          done < <(find . -name "*.sh" -not -path "./.git/*" -print0)
          for f in setup diagnose dots/.local/bin/rice-lock sdata/subcmd-virtmon/hypr_mon_guard; do
            count=$((count + 1))
            bash -n "$f" || { echo "::error file=$f::bash -n failed"; fail=1; }
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "All $count shell scripts passed syntax validation."

      - name: Check Portability (Zero Hardcoded Host Paths)
        run: |
          if grep -RIn "greyrat" dots/ sdata/ setup >/dev/null 2>&1; then
            echo "::error::Hardcoded user path 'greyrat' found in tracked files!"
            grep -RIn "greyrat" dots/ sdata/ setup
            exit 1
          fi
          echo "Portability check passed: zero hardcoded user paths."

  test-suite:
    name: Automated Regression Test Suite (Sandboxed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Test Prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rsync jq python3-pyqt6 python3-pyqt6.qtquick qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-templates libgl1

      - name: Run Sandboxed Test Suite
        run: |
          chmod +x ./tests/run-tests.sh
          ./tests/run-tests.sh
