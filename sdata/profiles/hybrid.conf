# Profile: hybrid
# Description: Hyprland + end-4 (illogical-impulse) + Caelestia Hybrid frontend and native QML plugin.
# shellcheck shell=bash

PROFILE_NAME="hybrid"
PROFILE_DESCRIPTION="Hyprland + end-4 + Caelestia Hybrid (dual-frontend rice)"

INSTALL_CAELESTIA_HYBRID=true
INSTALL_OPTIONAL_APPS=false
SKIP_MISCCONF_DEFAULT=false

ARCH_METAPKGS=(
  ./sdata/dist-arch/illogical-impulse-audio
  ./sdata/dist-arch/illogical-impulse-backlight
  ./sdata/dist-arch/illogical-impulse-basic
  ./sdata/dist-arch/illogical-impulse-fonts-themes
  ./sdata/dist-arch/illogical-impulse-kde
  ./sdata/dist-arch/illogical-impulse-portal
  ./sdata/dist-arch/illogical-impulse-python
  ./sdata/dist-arch/illogical-impulse-screencapture
  ./sdata/dist-arch/illogical-impulse-toolkit
  ./sdata/dist-arch/illogical-impulse-widgets
  ./sdata/dist-arch/illogical-impulse-hyprland
  ./sdata/dist-arch/illogical-impulse-microtex-git
  ./sdata/dist-arch/illogical-impulse-quickshell-git
  ./sdata/dist-arch/illogical-impulse-bibata-modern-classic-bin
  ./sdata/dist-arch/illogical-impulse-caelestia-plugin
  ./sdata/dist-arch/illogical-impulse-redshift-store
)

ARCH_EXTRA_PKGS=()

MANAGED_CONFIG_TARGETS=(
  "$XDG_CONFIG_HOME/hypr"
  "$XDG_CONFIG_HOME/quickshell/ii"
  "$XDG_CONFIG_HOME/quickshell/caelestia-hybrid"
  "$XDG_CONFIG_HOME/quickshell/ui-switch.sh"
  "$XDG_CONFIG_HOME/caelestia/shell.json"
  "$XDG_CONFIG_HOME/fastfetch"
  "$XDG_BIN_HOME/rice-lock"
  "$XDG_BIN_HOME/redshift-store"
  "$XDG_BIN_HOME/redshift-doctor"
  "$XDG_DATA_HOME/applications/redshift-store.desktop"
  "$XDG_DATA_HOME/icons/hicolor/scalable/apps/redshift-store.svg"
  "$XDG_DATA_HOME/redshift-os"
)
